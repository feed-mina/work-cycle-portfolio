name = "work-cycle"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 정적 화면 (public/) — /api/* 만 Worker가 먼저 처리
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

# ── Workers AI: Gemini 지역 제한 시에도 동작하는 기본 AI 경로 ──
[ai]
binding = "AI"
remote = true

# ── D1: 기록 DB ──────────────────────────────────────────────
# 1) npx wrangler d1 create work-cycle-db
# 2) 출력된 database_id를 아래에 붙여넣기
[[d1_databases]]
binding = "DB"
database_name = "work-cycle-db"
database_id = "<your-d1-database-id>"

# ── R2: 파일(회의록 원문·리뷰 이미지·백업) — M2부터 사용 ──────
# 1) npx wrangler r2 bucket create work-cycle-files
# 2) 아래 주석 해제
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "work-cycle-files"

# ── Cron: 카카오 리마인드 (표현식 1개) ───────────────────────
# 무료 플랜은 Worker당 트리거 3개까지 → 하나로 받아 코드(SLOTS)에서 시각을 보고 갈라 보냄
# 이 표현식이 담는 KST 시각: 08:25 아침 · 10:00 하루 시작 · 12:30 작업 중/AI
# · 13:00 주간업무보고 초안(금요일만) · 17:00 제출 전 · 17:40 저녁
# · 23:50 하루 기록 md → 볼트 history/ · 00:10 전날 파일 한 번 더 (src/vault-history.ts, 2026-10-02)
# 분·시를 합친 조합 중 위 표에 없는 시각은 코드에서 그냥 통과한다(호출만 늘고 하는 일 없음).
[triggers]
crons = ["0,10,25,30,40,50 23,1,3,4,8,14,15 * * *"]
