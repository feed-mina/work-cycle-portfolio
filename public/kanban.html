<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>work-cycle · 칸반</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=27-apricot">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/mobile.css">
<script src="/mobile.js" defer></script>
</head>
<body class="theme-monday">
<script src="/theme.js"></script><script src="/mode-switch.js"></script>
<script src="/ext.js" defer></script>
<div class="wrap">

<header class="top">
  <h1><img class="logo" src="/logo.svg?v=27-apricot" alt="">work-cycle</h1>
  <nav class="nav-tabs">
    <a href="/" data-mode="company">마이페이지</a><a href="/personal" data-mode="personal">개인 마이페이지</a><a href="/schedule">스케줄</a><a href="/meetings">회의록</a><a href="/kanban" class="on">칸반</a><a href="/dashboard" data-mode="company">검증 대시보드</a><a href="/personal-dashboard" data-mode="personal">나의 준비 현황</a><a href="/report">주간보고</a>
  </nav><span class="mode-slot"></span>
  <button class="mode-toggle" onclick="toggleDark()" title="다크 모드">◑</button>
  <span class="me" id="me">…</span>
</header>

<div class="card">
  <form class="inline" id="kForm">
    <input name="title" placeholder="카드 제목" required style="flex:1;min-width:180px">
    <select name="quadrant"><option>즉시처리</option><option>전략적계획</option><option>축소위임</option><option>취소연기</option></select>
    <input name="due" placeholder="마감 (예: ~8/21)" style="width:110px">
    <button class="btn2">+ 카드</button>
  </form>
</div>

<div class="card">
  <!-- 레포는 드롭다운(/api/github/repos, 1시간 캐시)에서 고른다. "직접 입력…"을 고르면 옆에 입력칸이 나온다. -->
  <form class="inline" id="ghForm" style="margin-top:0;align-items:center;gap:10px" onsubmit="return false">
    <h2 style="margin:0;font-size:15px">GitHub 이슈 가져오기</h2>
    <select id="ghRepo" aria-label="GitHub 레포" style="flex:1;min-width:180px"><option value="">레포 목록 불러오는 중…</option></select>
    <input id="ghRepoCustom" placeholder="owner/repo" aria-label="레포 직접 입력" style="flex:1;min-width:160px;display:none">
    <button type="button" class="btn2 ghost" id="ghRefresh" title="레포 목록 새로고침 (GitHub 다시 조회)" style="padding:0 10px">↻</button>
    <select id="ghQuad" aria-label="사분면"><option>즉시처리</option><option>전략적계획</option><option>축소위임</option><option>취소연기</option></select>
    <button type="button" class="btn2" id="ghLoad">열린 이슈 불러오기</button>
  </form>
  <div id="ghList" style="margin-top:10px"></div>
</div>

<div class="matrix" id="matrix"></div>

<details class="card" id="doneCard" style="display:none">
  <summary><b>완료한 카드</b> <span class="sub" id="doneCount">0</span>장 <span class="sub">— 펼치면 완료 날짜 · 되돌리기</span></summary>
  <div id="doneList"></div>
</details>

<div class="card" id="warnCard" style="display:none">
  <p class="sub" style="margin:0">⚠️ <b>"즉시 처리"가 3장을 넘었습니다</b> — 범위는 좁게, 결과는 빨리. 위임하거나 연기할 카드를 골라보세요.</p>
</div>

<footer>work-cycle</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (path, opt) => {
  const r = await fetch(path, opt ? { headers:{'Content-Type':'application/json'}, ...opt } : undefined);
  if (!r.ok) { alert((await r.json().catch(()=>({}))).error || '요청 실패'); throw new ApiError(path); }
  return r.json();
};
function esc(s){ return (s??'').toString().replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const QMETA = {
  '즉시처리':   { sub:'중요 · 긴급', c:'#E2445C' },
  '전략적계획': { sub:'중요 · 여유', c:'#579BFC' },
  '축소위임':   { sub:'덜중요 · 긴급', c:'#FDAB3D' },
  '취소연기':   { sub:'덜중요 · 여유', c:'#9699A6' },
};
const NEXT = { '즉시처리':'전략적계획', '전략적계획':'축소위임', '축소위임':'취소연기', '취소연기':'즉시처리' };
let ME = null;

async function load(){
  const d = await api('/api/kanban');
  // 완료(0022 done_at)한 카드는 사분면에서 빼고 아래 '완료한 카드'에 모은다. 사분면 장 수·즉시처리 경고는 진행 중 카드만 센다.
  const open = d.rows.filter(r=>!r.done_at), done = d.rows.filter(r=>r.done_at);
  $('#matrix').innerHTML = d.quads.map(q=>{
    const cards = open.filter(r=>r.quadrant===q);
    return `<div class="quad">
      <div class="quad-h" style="--qc:${QMETA[q].c}">${q.replace('위임',' · 위임').replace('연기',' · 연기')} <small>${QMETA[q].sub} · ${cards.length}장</small></div>
      ${cards.map(r=>`<div class="kcard" style="--kc:${esc(r.color||QMETA[q].c)}">
        <button class="ok" title="완료" aria-label="${esc(r.title)} 완료" onclick="doneCard(${r.id},true)">✓</button>
        <span class="kav">${esc((r.name||'?').slice(0,2).toUpperCase())}</span>
        <span>${esc(r.title)}${ghBadge(r)}</span>
        <small>${esc(r.due||'')}</small><label class="mobile-card-state">상태 변경<select aria-label="${esc(r.title)} 상태 변경" onchange="moveCard(${r.id},this.value)">${d.quads.map(state=>`<option ${state===q?'selected':''}>${esc(state)}</option>`).join('')}</select></label>
        <button class="mv" title="다음 칸으로 이동 (${NEXT[q]})" onclick="moveCard(${r.id},'${NEXT[q]}')">➜</button>
        ${r.user_email===ME?`<button class="rm" title="삭제" onclick="rmCard(${r.id})">×</button>`:''}
      </div>`).join('') || '<p class="sub" style="padding:12px">카드 없음</p>'}
    </div>`;
  }).join('');
  const box = $('#doneCard');
  box.style.display = done.length ? 'block' : 'none';
  $('#doneCount').textContent = done.length;
  done.sort((a,b)=>String(b.done_at).localeCompare(String(a.done_at)));
  $('#doneList').innerHTML = done.map(r=>`<div class="kcard done" style="--kc:${esc(r.color||QMETA[r.quadrant]?.c||'#9699A6')}">
      <span class="kav">${esc((r.name||'?').slice(0,2).toUpperCase())}</span>
      <span>${esc(r.title)}${ghBadge(r)}</span>
      <small>${esc(r.quadrant)} · ${esc(kstDate(r.done_at))} 완료</small>
      <button class="undo" title="되돌리기 (${esc(r.quadrant)}로)" onclick="doneCard(${r.id},false)">되돌리기</button>
      ${r.user_email===ME?`<button class="rm" title="삭제" onclick="rmCard(${r.id})">×</button>`:''}
    </div>`).join('');
  const urgent = open.filter(r=>r.quadrant==='즉시처리').length;
  $('#warnCard').style.display = urgent > 3 ? 'block' : 'none';
}
function ghBadge(r){
  return r.gh_issue_no?`
          <a class="ghbadge" href="https://github.com/${esc(r.gh_repo)}/issues/${r.gh_issue_no}"
             target="_blank" rel="noopener" title="${esc(r.gh_repo)} #${r.gh_issue_no}"
             onclick="event.stopPropagation()">◇ #${r.gh_issue_no}</a>`:'';
}
// done_at 은 D1 datetime('now') (UTC, "YYYY-MM-DD HH:MM:SS") → KST 날짜 MM-DD
function kstDate(s){ const t = Date.parse(String(s).replace(' ','T')+'Z'); return isNaN(t) ? '' : new Date(t + 9*3600000).toISOString().slice(5,10); }
async function moveCard(id, quadrant){ await api('/api/kanban/'+id,{method:'PATCH',body:JSON.stringify({quadrant})}); load(); }
async function doneCard(id, done){ await api('/api/kanban/'+id,{method:'PATCH',body:JSON.stringify({done})}); load(); }
async function rmCard(id){ await api('/api/kanban/'+id,{method:'DELETE'}); load(); }
$('#kForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const b = Object.fromEntries(new FormData(e.target));
  b.color = QMETA[b.quadrant].c;
  await api('/api/kanban',{method:'POST',body:JSON.stringify(b)});
  e.target.reset(); load();
});
// ── GitHub 레포 드롭다운 ──
const GH_CUSTOM = '__custom';
const GH_KEY = 'wc.gh.repo';
function ghPersonal(){ return document.documentElement.dataset.workMode === 'personal'; }
function ghSelectedRepo(){
  const v = $('#ghRepo').value;
  return v === GH_CUSTOM ? $('#ghRepoCustom').value.trim() : v;
}
function ghSyncCustom(){
  const custom = $('#ghRepo').value === GH_CUSTOM;
  $('#ghRepoCustom').style.display = custom ? '' : 'none';
  if (custom) $('#ghRepoCustom').focus();
}
async function loadRepos(refresh){
  const sel = $('#ghRepo');
  sel.innerHTML = '<option value="">레포 목록 불러오는 중…</option>';
  let d;
  try { d = await api('/api/github/repos' + (refresh ? '?refresh=1' : '')); }
  catch(e){ sel.innerHTML = `<option value="${GH_CUSTOM}">직접 입력… (목록 실패)</option>`; ghSyncCustom(); return; }
  const opts = [];
  // 회사용: 기본 대상(회사 git_targets)이 첫 항목. 개인용: 목록에서 바로 고른다(기본 대상 없음).
  if (!ghPersonal() && d.default_repo) opts.push(['', `기본 대상 · ${d.default_repo}`]);
  for (const r of d.repos) opts.push([r.full_name, `${r.full_name}${r.private ? ' 🔒' : ''}`]);
  opts.push([GH_CUSTOM, '직접 입력…']);
  sel.innerHTML = opts.map(([v,t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
  let saved = null; try { saved = localStorage.getItem(GH_KEY); } catch {}
  if (saved !== null && opts.some(([v]) => v === saved)) sel.value = saved;
  else if (saved && saved !== GH_CUSTOM && /^[\w.-]+\/[\w.-]+$/.test(saved)) { sel.value = GH_CUSTOM; $('#ghRepoCustom').value = saved; }
  else if (!(!ghPersonal() && d.default_repo)) sel.value = d.repos.length ? d.repos[0].full_name : GH_CUSTOM;
  ghSyncCustom();
  $('#ghRefresh').title = `레포 ${d.total}개 · ${d.cached ? '캐시 ' + (d.fetched_at || '') : 'GitHub 조회 ' + d.github_calls + '회'} · 클릭하면 다시 조회`;
}
$('#ghRepo').addEventListener('change', () => { ghSyncCustom(); try { localStorage.setItem(GH_KEY, $('#ghRepo').value); } catch {} });
$('#ghRepoCustom').addEventListener('change', () => { try { localStorage.setItem(GH_KEY, $('#ghRepoCustom').value.trim() || GH_CUSTOM); } catch {} });
$('#ghRefresh').addEventListener('click', () => loadRepos(true));
document.addEventListener('wc:mode', () => loadRepos(false));

// ── GitHub 이슈 → 카드 ──
async function loadIssues(){
  const repo = ghSelectedRepo();
  if ($('#ghRepo').value === GH_CUSTOM && !/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('#ghList').innerHTML = '<p class="sub" style="margin:0">owner/repo 형식으로 입력해주세요</p>'; return; }
  $('#ghList').innerHTML = '<p class="sub" style="margin:0">불러오는 중…</p>';
  let d;
  try { d = await api('/api/github/issues' + (repo ? '?repo='+encodeURIComponent(repo) : '')); }
  catch(e){ $('#ghList').innerHTML = ''; return; }
  $('#ghList').innerHTML = d.issues.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
      <thead><tr><th style="text-align:left;width:64px;padding:5px;color:var(--ink3)">번호</th>
        <th style="text-align:left;padding:5px;color:var(--ink3)">제목</th>
        <th style="width:90px;padding:5px"></th></tr></thead>
      <tbody>${d.issues.map(i=>`<tr style="border-top:1px solid var(--line)">
        <td style="padding:7px 5px;color:var(--ink3)">#${i.number}</td>
        <td style="padding:7px 5px">${esc(i.title)}</td>
        <td style="padding:7px 5px;text-align:right">${i.linked
          ? '<span class="sub" style="margin:0">카드 있음</span>'
          : `<button class="btn2 ghost" onclick="addFromIssue('${esc(d.repo)}',${i.number},this)">+ 카드</button>`}</td>
      </tr>`).join('')}</tbody>
    </table>` : '<p class="sub" style="margin:0">열린 이슈가 없습니다</p>';
}
async function addFromIssue(repo, no, btn){
  const row = btn.closest('tr');
  const title = row.children[1].textContent.trim();
  await api('/api/kanban',{method:'POST',body:JSON.stringify({
    title, quadrant: $('#ghQuad').value, gh_repo: repo, gh_issue_no: no, gh_state: 'open',
    color: QMETA[$('#ghQuad').value].c,
  })});
  loadIssues(); load();
}
$('#ghLoad').addEventListener('click', loadIssues);

(async function(){
  const me = await api('/api/me'); ME = me.email; $('#me').textContent = me.email;
  loadRepos(false);   // 카드가 열릴 때 1회 (캐시 1시간)
  load();
})();
</script>
<script src="/quick.js"></script>
<script src="/membership.js"></script>
<script src="/acc.js"></script>
<script src="/principles.js"></script>
</body>
</html>
